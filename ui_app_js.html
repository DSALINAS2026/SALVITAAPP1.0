<script>
  const $ = (id) => document.getElementById(id);

  // ===== IMPRESION MINI (NO DEPENDE DE ROUTER NI DE google.script) =====
  function printOTMini(){
    try{
      // Tomar datos de la OT abierta (modal consulta OT)
      const data = window.OT_MINI_PRINT || {};
      const nroOT = (data.nroOT || $("vNro")?.textContent || "").trim();
      const interno = (data.interno || $("vInt")?.textContent || "").trim();
      const dominio = (data.dominio || $("vDom")?.textContent || "").trim();

      if(!nroOT && !interno){
        toast ? toast("Abrí una OT primero.") : alert("Abrí una OT primero.");
        return;
      }

      const now = new Date();
      const dt = now.toLocaleString();

      const html = `<!doctype html>
<html><head><meta charset="utf-8">
<title>OT ${"${"}nroOT${"}"}</title>
<style>
  @page { size: A4; margin: 12mm; }
  body{ font-family: Arial, sans-serif; color:#111; font-size: 12px; margin:0; }
  .sheet{ padding:12mm; }
  .row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .otno{ font-size:22px; font-weight:900; border:2px solid #111; padding:8px 12px; border-radius:10px; }
  .box{ border:1px solid #111; border-radius:8px; padding:10px; margin-top:10px; }
  .muted{ color:#555; font-size:11px; }
  .line{ border-bottom:1px solid #111; height:22px; margin-top:6px; }
  .btnbar{ margin:10px 0; }
  @media print { .btnbar{ display:none; } }
</style></head>
<body>
  <div class="btnbar">
    <button onclick="window.print()">Imprimir</button>
    <button onclick="window.close()">Cerrar</button>
  </div>
  <div class="sheet">
    <div class="row">
      <div>
        <div style="font-weight:900;font-size:16px;">ORDEN DE TRABAJO</div>
        <div class="muted">Impresión: ${"${"}dt${"}"}</div>
      </div>
      <div class="otno">OT ${"${"}nroOT${"}"}</div>
    </div>

    <div class="box">
      <div><b>Interno:</b> ${"${"}interno${"}"}</div>
      <div><b>Dominio:</b> ${"${"}dominio${"}"}</div>
    </div>

    <div class="box">
      <div style="font-weight:800;margin-bottom:6px;">Checklist (marcar con lapicera)</div>
      <div style="display:flex; gap:10px;">
        <div style="flex:1; border:1px solid #111; height:160px; border-radius:6px;"></div>
        <div style="width:60mm;">
          <div><b>Operario</b></div>
          <div class="line"></div>
          <div class="muted">Firma y aclaración</div>
          <div style="height:12px;"></div>
          <div><b>Supervisor</b></div>
          <div class="line"></div>
          <div class="muted">Firma y aclaración</div>
        </div>
      </div>
      <div style="margin-top:10px;"><b>Observaciones</b></div>
      <div style="border:1px solid #111; height:70px; border-radius:6px;"></div>
    </div>

    <div class="muted" style="display:flex; justify-content:space-between; margin-top:10px;">
      <div>OT: ${"${"}nroOT${"}"} | Interno: ${"${"}interno${"}"}</div>
      <div>${"${"}dt${"}"}</div>
    </div>
  </div>
</body></html>`;

      const w = window.open("", "_blank");
      if(!w){
        alert("Popup bloqueado. Permití ventanas emergentes para imprimir.");
        return;
      }
      w.document.open();
      w.document.write(html);
      w.document.close();
      w.focus();
    }catch(err){
      console.error(err);
      alert("Error Mini Print: " + (err?.message || err));
    }
  }

  // ===== IMPRESION OT A4 (DATOS REALES DE CONSULTA OT) =====
  function printOTA4(){
    try{
      const pack = window.OT_PRINT_A4 || {};
      const h = pack.head || {};
      const tasksRaw = Array.isArray(pack.tasks) ? pack.tasks : [];

      // Fallback: si no existe OT_PRINT_A4, intentar tomar desde spans del modal
      const nroOT = (h.NroOT || $("vNro")?.textContent || "").trim();
      const interno = (h.Interno || $("vInt")?.textContent || "").trim();
      const dominio = (h.Dominio || $("vDom")?.textContent || "").trim();
      if(!nroOT && !interno){
        (typeof toast === "function") ? toast("Abrí una OT primero.") : alert("Abrí una OT primero.");
        return;
      }

      const tipoOT = (h.TipoOT || $("vTipo")?.textContent || "").trim();
      const estadoOT = (h.EstadoOT || $("vEstado")?.textContent || "").trim();
      const fechaOT = (h.Fecha || $("vFecha")?.textContent || "").trim();
      const solicita = (h.Solicita || $("vSol")?.textContent || "").trim();
      const deposito = (h.Deposito || $("vDep")?.textContent || "").trim();
      const sociedad = (h.Sociedad || $("vSoc")?.textContent || "").trim();
      const sector = (h.Sector || $("vSec")?.textContent || "").trim();
      const descripcion = (h.Descripcion || $("vDesc")?.textContent || "").trim();

      const tituloPrev = (h.NombrePreventivo || h.TipoPreventivo || "").trim();

      const now = new Date();
      const imp = now.toLocaleString();

      const tipoLow = (tipoOT || "").toLowerCase();
      const bigTitle = tipoLow.includes("prevent")
        ? ("PREVENTIVO: " + (tituloPrev || ""))
        : ("CORRECTIVO: Sector " + (sector || ""));

      // Si no hay tareas, imprimimos renglones vacíos para checklist
      const tasks = tasksRaw.length ? tasksRaw : Array.from({length: 18}, () => ({}));

      /*
        Paginación:
        - Páginas intermedias: SOLO tareas, por eso entran más.
        - Última página: tareas + observaciones + firmas (compacto, pero igual ocupa).
        Ajustá estos números si ves que Chrome corta distinto en tu PC.
      */
      const CAP_MID  = 30;   // páginas sin firmas
      const CAP_LAST = 18;   // última página con firmas (compactas)

      const pages = [];
      if(tasks.length <= CAP_LAST){
        pages.push({ items: tasks, withSign: true });
      }else{
        const lastItems = tasks.slice(-CAP_LAST);
        const rest = tasks.slice(0, -CAP_LAST);
        for(let i=0; i<rest.length; i+=CAP_MID){
          pages.push({ items: rest.slice(i, i+CAP_MID), withSign: false });
        }
        pages.push({ items: lastItems, withSign: true });
      }

      const totalPages = pages.length;

      function taskRows(items){
        return items.map((t)=>{
          const cod = escapeHtml((t && t.CodigoTarea) ? t.CodigoTarea : "");
          const nom = escapeHtml((t && t.NombreTarea) ? t.NombreTarea : "");
          const main = (cod || nom)
            ? `<div class="tmain">${cod}${cod && nom ? " — " : ""}${nom}</div>`
            : `<div class="tmain">&nbsp;</div>`;
          return `
            <tr>
              <td>${main}</td>
              <td class="c"><span class="box"></span></td>
              <td class="c"><span class="box"></span></td>
            </tr>`;
        }).join("");
      }

      function headerHTML(){
        return `
          <div class="row">
            <div>
              <div class="title">ORDEN DE TRABAJO</div>
              <div class="muted">
                Creación: ${escapeHtml(fechaOT || "")} &nbsp;|&nbsp; Impresión: ${escapeHtml(imp)}
              </div>
              <div class="muted">
                Tipo: ${escapeHtml(tipoOT || "")} &nbsp;|&nbsp; Estado: ${escapeHtml(estadoOT || "")}
              </div>
              <div class="bigTitle">${escapeHtml(bigTitle)}</div>
            </div>
            <div class="otno">OT ${escapeHtml(nroOT)}</div>
          </div>

          <div class="card headCard">
            <div class="grid">
              <div class="kv"><b>Interno:</b> ${escapeHtml(interno)}</div>
              <div class="kv"><b>Dominio:</b> ${escapeHtml(dominio)}</div>
              <div class="kv"><b>Sociedad:</b> ${escapeHtml(sociedad)}</div>
              <div class="kv"><b>Depósito:</b> ${escapeHtml(deposito)}</div>
              <div class="kv"><b>Sector:</b> ${escapeHtml(sector)}</div>
              <div class="kv"><b>Solicita:</b> ${escapeHtml(solicita)}</div>
            </div>

            <div class="kv" style="margin-top:6px;">
              <b>Descripción:</b>
              <div class="desc">${escapeHtml(descripcion).replace(/\n/g,"<br>")}</div>
            </div>
          </div>
        `;
      }

      function footerHTML(pageIndex){
        return `
          <div class="footer">
            <div>OT ${escapeHtml(nroOT)} | Interno ${escapeHtml(interno)}</div>
            <div>Hoja ${pageIndex}/${totalPages}</div>
            <div>${escapeHtml(imp)}</div>
          </div>
        `;
      }

      const pagesHTML = pages.map((p, i) => {
        const pageNo = i+1;

        const signBlock = p.withSign ? `
          <div class="card signCard">
            <div class="sectionTitle">Observaciones</div>
            <div class="obs"></div>

            <div class="sectionTitle" style="margin-top:8px;">Firmas</div>

            <div class="signRow">
              <div class="ops">
                <div class="sigMini"><b>Operario 1</b><div class="line"></div><div class="cap">Firma y aclaración</div></div>
                <div class="sigMini"><b>Operario 2</b><div class="line"></div><div class="cap">Firma y aclaración</div></div>
                <div class="sigMini"><b>Operario 3</b><div class="line"></div><div class="cap">Firma y aclaración</div></div>
                <div class="sigMini"><b>Operario 4</b><div class="line"></div><div class="cap">Firma y aclaración</div></div>
              </div>

              <div>
                <div class="superMini">
                  <div style="font-weight:800; font-size:11px; margin-bottom:6px;">Supervisor</div>
                  <div class="line"></div>
                  <div class="cap">Firma y sello</div>
                </div>
              </div>
            </div>
          </div>
        ` : ``;

        return `
          <section class="page">
            ${headerHTML()}
            <div class="card tasksCard">
              <div class="sectionTitle">Checklist (marcar con lapicera)</div>
              <table>
                <thead>
                  <tr>
                    <th>Tarea</th>
                    <th class="c">OK</th>
                    <th class="c">N/R</th>
                  </tr>
                </thead>
                <tbody>
                  ${taskRows(p.items)}
                </tbody>
              </table>
            </div>
            ${signBlock}
            ${footerHTML(pageNo)}
          </section>
        `;
      }).join("");

      const html = `<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OT ${escapeHtml(nroOT)}</title>
<style>
  @page { size:A4; margin:8mm; }
  body{ font-family: Arial, sans-serif; font-size: 11px; color:#111; margin:0; }
  .toolbar{ position:fixed; top:6px; left:6px; display:flex; gap:8px; z-index:9999; }
  .toolbar button{ font-size:12px; padding:4px 10px; }
  @media print{ .toolbar{ display:none; } }

  .page{ page-break-after: always; break-after: page; min-height: 277mm; display:flex; flex-direction:column; }
  .page:last-child{ page-break-after: auto; }

  .row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .title{ font-size:15px; font-weight:900; margin:0; letter-spacing:.2px; }
  .muted{ color:#444; font-size:10px; margin-top:1px; }
  .bigTitle{ font-size:13px; font-weight:900; margin-top:4px; text-transform:uppercase; text-align:center; }
  .otno{ font-size:16px; font-weight:900; border:2px solid #111; padding:6px 10px; border-radius:10px; }

  .card{ border:1px solid #111; border-radius:10px; padding:8px; margin-top:6px; }
  .headCard{ padding:7px; }
  .grid{ display:grid; grid-template-columns: 1fr 1fr; gap:6px 10px; margin-top:4px; }
  .kv b{ display:inline-block; min-width:74px; }
  .desc{ margin-top:2px; }
  .sectionTitle{ font-size:11px; font-weight:800; margin-bottom:5px; }

  table{ width:100%; border-collapse:collapse; margin-top:4px; }
  thead{ display: table-header-group; }
  th,td{ border:1px solid #111; padding:5px 6px; vertical-align:top; }
  th{ background:transparent; font-size:10px; text-transform:uppercase; letter-spacing:.2px; }
  .c{ text-align:center; width:40px; }
  .tmain{ font-weight:700; }
  .box{ display:inline-block; width:12px; height:12px; border:1.6px solid #111; border-radius:2px; }

  /* Última página: firmas bien compactas + observación grande */
  .signCard{ --sigH: 34px; --sigGap: 6px; }
  .obs{ height:130px; border:1px solid #111; border-radius:10px; margin-top:4px; }

  .signRow{ display:grid; grid-template-columns: 1fr 0.8fr; gap:10px; align-items:start; margin-top:8px; }
  .ops{ display:flex; flex-direction:column; gap:var(--sigGap); }
  .sigMini{ border:1px solid #111; border-radius:10px; padding:4px 6px; height:var(--sigH); display:flex; flex-direction:column; justify-content:flex-end; }
  .superMini{ border:1px solid #111; border-radius:10px; padding:6px 8px; height: calc(4*var(--sigH) + 3*var(--sigGap)); display:flex; flex-direction:column; justify-content:flex-end; }

  .line{ border-bottom:1px solid #111; height:12px; }
  .cap{ font-size:8px; color:#333; margin-top:2px; }

  .footer{ display:flex; justify-content:space-between; gap:10px; margin-top:auto; font-size:10px; color:#111; }
</style>
</head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">Imprimir</button>
    <button onclick="window.close()">Cerrar</button>
  </div>

  ${pagesHTML}

</body>
</html>`;

      const w = window.open("", "_blank");
      if(!w){ alert("El navegador bloqueó la ventana emergente."); return; }
      w.document.open();
      w.document.write(html);
      w.document.close();
      w.focus();
    }catch(err){
      console.error(err);
      alert("Error Imprimir OT A4: " + (err?.message || err));
    }
  }


  let TOKEN = localStorage.getItem("TOKEN") || "";
  let SESSION = null;

  let CACHE_ROWS = [];   // chasis
  let CACHE_MOV = [];    // movimientos
  let CACHE_TAREAS = []; // tareas

  let IS_ADMIN = false;
  let EDIT_ROW = null;

  let OPTIONS = { ejes: [], mapas: [], carrocerias: [] };
  let MOV_OPTS = { unidades: [], depositos: [] };
  let TAREAS_OPTS = { sistemas: [], subsistemas: [], sectores: [] };

  // movimiento state
  let MOV_TIPO = "";
  let MOV_LAST = 0;

  function render() {
    if (!TOKEN) return renderLogin();
    renderShell();
    pingSession();
  }

  function renderLogin() {
    $("app").innerHTML = `
      <div class="loginWrap">
        <div class="card">
          <div class="brand" style="margin:0 0 10px 0;color:var(--ink)">
            <div class="dot"></div><h1>Ingreso seguro</h1>
          </div>
          <p class="muted" style="margin-top:0">Acceso a gestión</p>

          <label class="muted"><b>Usuario</b></label>
          <input id="lUser" placeholder="Tu usuario" />
          <div style="height:8px"></div>
          <label class="muted"><b>Contraseña</b></label>
          <input id="lPass" type="password" placeholder="Tu contraseña" />

          <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px">
            <button class="btn" onclick="doLogin()">Entrar</button>
          </div>

          <div id="lMsg" class="error" style="display:none"></div>
        </div>
      </div>
    `;
  }

  function renderShell() {
    $("app").innerHTML = `
      <div class="app">
        <aside class="sidebar">
          <div class="brand"><div class="dot"></div><h1>Mantenimiento</h1></div>
          <div class="nav">
            <button id="navCh" class="active" onclick="setActiveNav('ch'); showChasis();">
              <span>ChasisBD</span><small>Lista</small>
            </button>
            <button id="navMov" onclick="setActiveNav('mov'); showMovimientos();">
              <span>Movimientos</span><small>Ingreso/Egreso</small>
            </button>
            <button id="navTar" onclick="setActiveNav('tar'); showTareas();">
              <span>Maestro Tareas</span><small>Alta/Buscar</small>
            </button>
            <button id="navOT" onclick="setActiveNav('ot'); showOT();">
             <span>OT</span><small>Correct/Prev</small>
            </button>
            <button id="navHP" onclick="setActiveNav('hp'); showHP();">
              <span>Hojas Preventivas</span><small>Buscar / Crear</small>
            </button>


          <button id="navEU" onclick="setActiveNav('eu'); showEstadoUnidad();">
  <span>Estado Unidad</span><small>Preventivos</small>
</button>

</div>
          <div style="margin-top:14px;opacity:.95">
            <button class="btn secondary" style="width:100%" onclick="doLogout()">Cerrar sesión</button>
          </div>
        </aside>

        <main class="main">
          <div class="topbar">
            <div class="clock" id="clock">--:--:--</div>
            <div class="userbox">
              <div class="chip"><b>Usuario:</b> <span id="uName">-</span></div>
              <div class="chip"><b>Rol:</b> <span id="uRol">-</span></div>
            </div>
          </div>

          <div id="view"></div>
        </main>
      </div>
    `;
    startClock();
  }

  function setActiveNav(which){
    $("navCh")?.classList.remove("active");
    $("navMov")?.classList.remove("active");
    $("navTar")?.classList.remove("active");
    $("navOT")?.classList.remove("active");
    $("navHP")?.classList.remove("active");
    $("navEU")?.classList.remove("active");
    if (which === "ch") $("navCh")?.classList.add("active");
    if (which === "mov") $("navMov")?.classList.add("active");
    if (which === "tar") $("navTar")?.classList.add("active");
    if (which === "ot") $("navOT")?.classList.add("active");
    if (which === "hp") $("navHP")?.classList.add("active");
    if (which === "eu") $("navEU")?.classList.add("active");

  }

  function startClock() {
    const tick = () => {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2,"0");
      const mm = String(d.getMinutes()).padStart(2,"0");
      const ss = String(d.getSeconds()).padStart(2,"0");
      $("clock").textContent = `${hh}:${mm}:${ss}`;
    };
    tick();
    setInterval(tick, 1000);
  }

  function pingSession() {
    google.script.run.withSuccessHandler(res => {
      if (!res || !res.ok) {
        TOKEN = ""; localStorage.removeItem("TOKEN");
        SESSION = null;
        return render();
      }
      SESSION = res.user;
      IS_ADMIN = (SESSION.r === "ADMIN" || SESSION.r === "ADMINISTRADOR");
      $("uName").textContent = SESSION.n || SESSION.u;
      $("uRol").textContent = SESSION.r || "-";

      loadOptions(() =>
        loadMovOptions(() =>
          loadTareasOptions(() =>
            showChasis()
          )
        )
      );
    }).withFailureHandler(() => {
      TOKEN = ""; localStorage.removeItem("TOKEN");
      render();
    }).getSession(TOKEN);
  }

  function doLogin() {
    const u = $("lUser").value.trim();
    const p = $("lPass").value;
    $("lMsg").style.display = "none";

    google.script.run.withSuccessHandler(res => {
      if (!res.ok) {
        $("lMsg").textContent = res.msg || "Error";
        $("lMsg").style.display = "block";
        return;
      }
      TOKEN = res.token;
      localStorage.setItem("TOKEN", TOKEN);
      render();
    }).withFailureHandler(err => {
      $("lMsg").textContent = err.message || String(err);
      $("lMsg").style.display = "block";
    }).login(u, p);
  }

  function doLogout() {
    const t = TOKEN;
    TOKEN = ""; localStorage.removeItem("TOKEN");
    google.script.run.logout(t);
    render();
  }

  // ===== selects Chasis =====
  function loadOptions(cb){
    google.script.run.withSuccessHandler(res => {
      if (res && res.ok) OPTIONS = res;
      if (cb) cb();
    }).withFailureHandler(() => cb && cb()).getSelectOptions(TOKEN);
  }

  // ===== selects Mov =====
  function loadMovOptions(cb){
    google.script.run.withSuccessHandler(res => {
      if (res && res.ok) MOV_OPTS = res;
      if (cb) cb();
    }).withFailureHandler(() => cb && cb()).getMovSelectOptions(TOKEN);
  }

  // ===== selects Tareas =====
  function loadTareasOptions(cb){
    google.script.run.withSuccessHandler(res => {
      if (res && res.ok) TAREAS_OPTS = res;
      if (cb) cb();
    }).withFailureHandler(() => cb && cb()).getTareasSelectOptions(TOKEN);
  }

  function fillSelect(id, arr, currentValue, firstLabel){
    const el = $(id);
    if (!el) return;

    const cur = (currentValue ?? "").toString().trim();
    const list = (arr || []).slice();

    const first = (firstLabel ?? "(seleccionar)").toString();
    let html = `<option value="">${escapeHtml(first)}</option>`;

    list.forEach(v => {
      const sel = (v === cur) ? "selected" : "";
      html += `<option ${sel} value="${escapeHtml(v)}">${escapeHtml(v)}</option>`;
    });

    if (cur && !list.includes(cur)) {
      html = `<option selected value="${escapeHtml(cur)}">${escapeHtml(cur)}</option>` + html;
    }

    el.innerHTML = html;
  }

  function fillUnidadSelect(){
    const el = $("mUnidadSel");
    if (!el) return;
    let html = `<option value="">(seleccionar unidad)</option>`;
    (MOV_OPTS.unidades || []).forEach(u=>{
      html += `<option value="${escapeHtml(u.value)}">${escapeHtml(u.label)}</option>`;
    });
    el.innerHTML = html;
  }

  function fillDepositoSelect(current){
    const el = $("mDepositoSel");
    if (!el) return;
    const cur = (current ?? "").toString();
    let html = `<option value="">(seleccionar depósito)</option>`;
    (MOV_OPTS.depositos || []).forEach(d=>{
      const sel = d === cur ? "selected" : "";
      html += `<option ${sel} value="${escapeHtml(d)}">${escapeHtml(d)}</option>`;
    });
    html += `<option value="__OTRO__">Otro…</option>`;
    el.innerHTML = html;
  }

  // ===================== CHASIS VIEW =====================
  function showChasis() {
    setActiveNav("ch");
    $("view").innerHTML = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
          <div>
            <div style="font-size:18px;font-weight:1000">ChasisBD</div>
            <div class="muted">Visualizá, buscá y (si sos ADMIN) gestioná estados.</div>
          </div>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <button class="btn" onclick="openAdd()" id="btnAdd" style="display:none">+ Agregar chasis</button>
            <button class="btn secondary" onclick="loadChasis()">Actualizar</button>
          </div>
        </div>

        <div class="row" style="margin-top:10px" id="kpis"></div>

        <div class="controls">
          <input id="q" placeholder="Buscar: interno / dominio / sociedad..." oninput="applyFilter()" />
          <select id="f" onchange="applyFilter()">
            <option value="">Estado: todos</option>
            <option value="activo">activo</option>
            <option value="inactivo">inactivo</option>
            <option value="baja">baja</option>
          </select>
          <div class="muted" id="count"></div>
        </div>

        <div style="overflow:auto">
          <table>

      $("thAcc").style.display = IS_ADMIN ? "table-cell" : "none";

      $("kpis").innerHTML = `

  function applyFilter() {
    const q = ($("q")?.value || "").toLowerCase().trim();
    const f = ($("f")?.value || "").toLowerCase().trim();

    const rows = CACHE_ROWS.filter(r => {
      const blob = `${r.Interno} ${r.Dominio} ${r.Sociedad} ${r.Deposito} ${r.Tipo}`.toLowerCase();
      const okQ = !q || blob.includes(q);
      const okF = !f || (r.Estado === f);
      return okQ && okF;
    });

    $("count").textContent = `${rows.length} resultado(s)`;

    $("tbody").innerHTML = rows.map(r => {
      const est = (r.Estado || "activo");
      const estadoBadge = `<span class="estado ${est}"><span class="dot2"></span>${est}</span>`;

      const acc = IS_ADMIN ? `
        <td>
          <div class="actions">
            <button class="mini" onclick="quickEdit(${r._row})">Editar</button>
            <button class="mini" onclick="setEstado(${r._row},'activo')">Activo</button>
            <button class="mini" onclick="setEstado(${r._row},'inactivo')">Inactivo</button>
            <button class="mini" onclick="setEstado(${r._row},'baja')">Baja</button>
          </div>
        </td>` : ``;

      return `
        <tr>
          <td><b>${escapeHtml(r.Interno)}</b></td>
          <td>${escapeHtml(r.Dominio)}</td>
          <td>${escapeHtml(r.Sociedad)}</td>
          <td>${escapeHtml(r.Deposito)}</td>
          <td>${escapeHtml(r.Tipo)}</td>
          <td>${escapeHtml(r.KmRecorridos)}</td>
          <td>${estadoBadge}</td>
          ${IS_ADMIN ? acc : ""}
        </tr>
      `;
    }).join("") || `<tr><td colspan="${IS_ADMIN?8:7}" class="muted">Sin resultados.</td></tr>`;
  }

  function loadMovimientos(){

  function applyMovFilter(){
    const q = ($("mq")?.value || "").toLowerCase().trim();
    const tipo = ($("mt")?.value || "").toLowerCase().trim();
    const dep = ($("mdepSel")?.value || "").toLowerCase().trim();

    const from = $("mfrom")?.value ? new Date($("mfrom").value + "T00:00:00").getTime() : null;
    const to = $("mto")?.value ? new Date($("mto").value + "T23:59:59").getTime() : null;

    const rows = CACHE_MOV.filter(r => {
      const okQ = !q || (r.Unidad || "").toLowerCase().includes(q);
      const okT = !tipo || (r.Tipo || "").toLowerCase() === tipo;
      const okD = !dep || (r.Deposito || "").toLowerCase() === dep;

      const fm = r.FechaMovMs ?? null;
      const okF = (!from || (fm !== null && fm >= from)) && (!to || (fm !== null && fm <= to));

      return okQ && okT && okD && okF;
    });

    $("mcount").textContent = `${rows.length} movimiento(s)`;

    $("mtbody").innerHTML = rows.map(r => `
      <tr>
        <td><b>${fmtDate(r.FechaMovMs)} ${escapeHtml(r.HoraMov || "")}</b></td>
        <td><b>${escapeHtml(r.Unidad)}</b></td>
        <td>${escapeHtml(r.Tipo)}</td>
        <td>${escapeHtml(r.Deposito)}</td>
        <td>${escapeHtml(String(r.UltimoOdometro ?? 0))}</td>
        <td>${escapeHtml(String(r.Odometro ?? 0))}</td>
        <td>${escapeHtml(String(r.KmRecorridos ?? 0))}</td>
        <td>${escapeHtml((r.Observacion || "").slice(0,40))}</td>
      </tr>
    `).join("") || `<tr><td colspan="8" class="muted">Sin resultados.</td></tr>`;
  }

    validateMovInputs();
  }

  function openMov(){
    $("movMsg").style.display = "none";

    MOV_TIPO = "";
    MOV_LAST = 0;

    setTipoMov("");
    $("mUlt").value = "";

    $("mKm").value = "";
    $("mObs").value = "";
    $("mDepositoOtherWrap").style.display = "none";
    $("mDepositoOther").value = "";

    const now = new Date();
    $("mFecha").value = now.toISOString().slice(0,10);
    $("mHora").value = now.toTimeString().slice(0,5);

    fillUnidadSelect();
    fillDepositoSelect("");

    $("mDepositoSel").onchange = () => {
      const v = $("mDepositoSel").value;
      const show = (v === "__OTRO__");
      $("mDepositoOtherWrap").style.display = show ? "block" : "none";
      if (!show) $("mDepositoOther").value = "";
      validateMovInputs();
    };

    $("mUnidadSel").onchange = () => {
      const unidad = $("mUnidadSel").value.trim();
      MOV_LAST = 0;
      $("mUlt").value = "";
      $("mKm").value = "";
      $("mOdo").value = "";
      validateMovInputs();

      if (!unidad) return;

      google.script.run.withSuccessHandler(res => {
        const last = Number(res?.last || 0);
        MOV_LAST = last;
        $("mUlt").value = String(last);
        calcKmLive();
        validateMovInputs();

        const u = (MOV_OPTS.unidades || []).find(x => x.value === unidad);
        if (u && u.deposito) {
          fillDepositoSelect(u.deposito);
        }
      }).withFailureHandler(err => {
        showMovErr(err.message || String(err));
      }).getUltimoOdometer(TOKEN, unidad);
    };

    $("mOdo").oninput = () => {
      calcKmLive();
      validateMovInputs();
    };

    $("mFecha").onchange = validateMovInputs;
    $("mHora").onchange = validateMovInputs;

    validateMovInputs();
  }

  function closeMov(){ $("modalMov").style.display = "none"; }

  function calcKmLive(){
    const odo = parseInt(($("mOdo").value || "").toString().replace(/[^\d]/g,""), 10);
    if (!isFinite(odo)) { $("mKm").value = ""; return; }
    const km = odo - (MOV_LAST || 0);
    $("mKm").value = String(isFinite(km) ? km : "");
  }

  function validateMovInputs(){
    const unidad = $("mUnidadSel").value.trim();
    const fecha = $("mFecha").value;
    const hora = $("mHora").value;

    let dep = $("mDepositoSel").value.trim();
    if (dep === "__OTRO__") dep = $("mDepositoOther").value.trim();

    const odo = parseInt(($("mOdo").value || "").toString().replace(/[^\d]/g,""), 10);

    let err = "";

    if (!unidad) err = "Unidad es obligatoria.";
    else if (!MOV_TIPO) err = "Elegí Tipo: Ingreso o Egreso.";
    else if (!fecha) err = "Fecha es obligatoria.";
    else if (!hora) err = "Hora es obligatoria.";
    else if (!dep) err = "Depósito es obligatorio.";
    else if (!isFinite(odo) || odo <= 0) err = "Odómetro inválido.";
    else if (isFinite(MOV_LAST) && odo < MOV_LAST) err = `Odómetro no puede ser menor al último (${MOV_LAST}).`;

    const btn = $("btnSaveMov");
    if (err) {
      btn.style.pointerEvents = "none";
      btn.style.opacity = "0.7";
      $("mOdoHint").innerHTML = `<span class="error">${escapeHtml(err)}</span>`;
    } else {
      btn.style.pointerEvents = "";
      btn.style.opacity = "";
      $("mOdoHint").innerHTML = `Ok. Km se calcula automáticamente.`;
    }
  }

  function showMovErr(msg){
    $("movMsg").textContent = msg;
    $("movMsg").style.display = "block";
  }

  function saveMov(){
    $("movMsg").style.display = "none";

    const Unidad = $("mUnidadSel").value.trim();
    const FechaISO = $("mFecha").value;
    const HoraMov = $("mHora").value;

    let Deposito = $("mDepositoSel").value.trim();
    if (Deposito === "__OTRO__") Deposito = $("mDepositoOther").value.trim();

    const Odometro = parseInt(($("mOdo").value || "").toString().replace(/[^\d]/g,""), 10);
    const Observacion = $("mObs").value.trim();

    if (!Unidad) return showMovErr("Unidad es obligatoria.");
    if (!MOV_TIPO) return showMovErr("Elegí Tipo: Ingreso o Egreso.");
    if (!FechaISO) return showMovErr("Fecha es obligatoria.");
    if (!HoraMov) return showMovErr("Hora es obligatoria.");
    if (!Deposito) return showMovErr("Depósito es obligatorio.");
    if (!isFinite(Odometro) || Odometro <= 0) return showMovErr("Odómetro inválido.");
    if (Odometro < (MOV_LAST || 0)) return showMovErr(`Odómetro no puede ser menor al último (${MOV_LAST}).`);

    setLoading("btnSaveMov", true);

    google.script.run.withSuccessHandler(() => {
      setLoading("btnSaveMov", false);
      toast("✅ Movimiento guardado");
      closeMov();
      loadMovimientos();
      loadChasis();
      loadMovOptions();
    }).withFailureHandler(err => {
      setLoading("btnSaveMov", false);
      showMovErr(err.message || String(err));
    }).addMovimiento(TOKEN, { Unidad, Tipo: MOV_TIPO, FechaISO, HoraMov, Odometro, Deposito, Observacion });
  }

  function applyTareasFilter(){

      const okQ = !q || blob.includes(q);
      const okS = !sis || (r.sistema||"").toLowerCase() === sis;
      const okSub = !sub || (r.subsistema||"").toLowerCase() === sub;
      const okSec = !sec || (r.sector||"").toLowerCase() === sec;
      return okQ && okS && okSub && okSec;

function euInferClase(it){
  // prioridad: pasado > 0 => pasado
  const pasadoNum = Number(String(it.Pasado||"").replace(/[^0-9.-]/g,"")) || 0;
  if (pasadoNum > 0) return "pasado";
  const clase = (it.Clase||"").toString().toLowerCase();
  if (clase) return clase;
  // si no hay Clase, inferimos "proximo" si estamos cerca de vencer:
  // km: falta <= 10% del intervalo ; dia: falta <= avisoDias o 7 por defecto
  const tipo = (it.Tipo||it.ControlTipo||"").toString().toLowerCase();
  const cada = Number(String(it.Cada||it.CadaKm||it.CadaDias||"").replace(/[^0-9.-]/g,"")) || 0;
  if (tipo.includes("km")){
    const actual = Number(String(it.Actual||"").replace(/[^0-9.-]/g,"")) || 0;
    if (cada>0){
      const faltan = cada - actual;
      if (faltan <= Math.max(1, Math.round(cada*0.10))) return "proximo";
    }
  } else {
    const actual = Number(String(it.Actual||"").replace(/[^0-9.-]/g,"")) || 0; // días desde último
    if (cada>0){
      const faltan = cada - actual;
      if (faltan <= 7) return "proximo";
    }
  }
  return "ok";
}

function euRenderTable(items){

  tb.innerHTML = items.map(it=>{
    const codigo  = it.Codigo || it.IdHP || it.Cod || "-";
    const nombre  = it.NombreHP || it.Preventivo || "";
    const cada    = it.CadaStr || it.Cada || "";
    const ultimo  = it.UltimoStr || it.Ultimo || "";
    const actual  = it.ActualStr || it.Actual || "";
    const proximo = it.ProximoStr || it.Proximo || "";
    const pasado  = it.PasadoStr || it.Pasado || "0";

    const nroOT = it.NroOT || "";
    const idOT  = it.IdOT || "";
    const interno = it.Interno || (EU_LAST.interno || "");
    const idHP = it.IdHP || it.Codigo || it.Cod || "";

    const btnOT = idOT
      ? `<button type="button" class="iconBtn" title="Ver OT" onclick="openOTView('${escapeHtml(idOT)}')">👁️</button>`
      : `<button type="button" class="mini otPill" title="Crear OT preventiva" onclick="openOTNewPrevFromEU('${escapeHtml(interno)}','${escapeHtml(idHP)}','${escapeHtml(nombre)}')">+ OT</button>`;

    const btnRep = `<button type="button" class="mini" title="Reprogramar" onclick="openEUReprogNew('${escapeHtml(interno)}','${escapeHtml(idHP)}','${escapeHtml(nombre)}','${escapeHtml(it.Control||it.Tipo||'')}','${escapeHtml(it.CadaKm||it.CadaKM||it.Cada||'')}','${escapeHtml(it.CadaDias||it.CadaDia||it.CadaDiasStr||'')}','${escapeHtml(it.UltimoKm||it.Ultimo||'')}','${escapeHtml(it.UltimaFecha||it.UltimoFecha||'')}')">Reprog</button>`;

    return `

/**
 * Abre modal OT preventiva desde Estado Unidad, dejando Interno/Preventivo pre-cargados.
 * Interno y preventivo NO se borran (solo completás "Solicita").
 */
function openOTNewPrevFromEU(interno, idHP, nombreHP){
  try{
    openOTNewPrev(); // abre y carga combos
    // Esperamos a que OT_PREV_CREATE se cargue
    const wait = () => {
      if (typeof OT_PREV_CREATE === "undefined" || !OT_PREV_CREATE) return setTimeout(wait, 120);

      // Set interno
      const uSel = $("pOTInterno");
      if (uSel){
        uSel.value = String(interno||"").trim();
        // dispara onchange para cargar datos de unidad
        uSel.dispatchEvent(new Event("change"));
        // bloquea (solo para este flujo)
        uSel.disabled = true;
      }

      // Set preventivo
      const setHP = () => {
        const hpSel = $("pOTHP");
        if (!hpSel) return;
        hpSel.value = String(idHP||"").trim();
        hpSel.dispatchEvent(new Event("change"));
        hpSel.disabled = true;
      };
      setTimeout(setHP, 150);

      // Mantener el solicitante vacío para completar
      const sol = $("pOTSolicita");
      if (sol){
        sol.value = "";
        sol.focus();
      }
    };
    wait();
  }catch(err){
    console.error(err);
    toast("No se pudo abrir OT.");
  }
}

function euReprogramar(interno, idHP, controlTipo){
  const tipo = (controlTipo || "").toString().toLowerCase();
  let nuevo = null;

  if (tipo === "km"){
    const v = prompt("Nuevo ÚLTIMO (Km) desde donde volver a contar:");
    if (v === null) return;
    const n = parseInt(String(v).replace(/[^\d]/g,""), 10);
    if (!isFinite(n) || n < 0) return alert("Km inválido.");
    nuevo = n;
  } else {
    const v = prompt("Nueva ÚLTIMA FECHA (YYYY-MM-DD) desde donde volver a contar:");
    if (v === null) return;
    const s = String(v).trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return alert("Fecha inválida. Usá YYYY-MM-DD");
    nuevo = s; // enviamos string, el service lo parsea
  }

  const motivo = (prompt("Motivo de reprogramación (obligatorio):") || "").trim();
  if (!motivo) return alert("Motivo es obligatorio.");

  google.script.run.withSuccessHandler(res=>{
    if (!res?.ok) return alert(res?.msg || "No se pudo reprogramar.");
    toast("⏱ Reprogramado");
    if ($("euInterno")) $("euInterno").value = interno;
    euBuscar();
  }).withFailureHandler(err=>{
    alert(err.message || String(err));
  }).reprogramarPreventivoUnidadV7(TOKEN, interno, idHP, nuevo, motivo);
}

function openEUReprogNew(interno, idHP, nombreHP, control, cadaKm, cadaDias, ultimoKm, ultimaFecha){
  try{
    ensureEUReprogNewModal();
    $("euRNMsg").textContent = "";

    const i = (interno||"").toString().trim();
    const h = (idHP||"").toString().trim();
    if (!i || !h){
      toast && toast("Falta Interno o IdHP");
      return;
    }

    $("euRNInterno").value = i;
    $("euRNIdHP").value = h;
    $("euRNControl").value = (control||"").toString().trim();
    $("euRNCadaKm").value = (cadaKm||"").toString().trim();
    $("euRNCadaDias").value = (cadaDias||"").toString().trim();
    $("euRNMotivo").value = "";

    // Title centered
    $("euRNTitle").innerHTML = `<div style="text-align:center;font-weight:1000">${escapeHtml(nombreHP||"")}</div>
      <div class="muted" style="text-align:center">Interno ${escapeHtml(i)} · ${escapeHtml(h)}</div>`;

    const ctrl = (control||"").toString().toUpperCase();
    const isDias = ctrl.includes("DIA") || ctrl.includes("DÍ") || ctrl.includes("FECHA") || String(cadaDias||"").trim() !== "";
    $("euRNRowDate").style.display = isDias ? "block" : "none";
    $("euRNRowKm").style.display   = isDias ? "none"  : "block";

    // referencias
    if (isDias){
      $("euRNFecha").value = ""; // user picks
      $("euRNRefDate").textContent = "Referencia: Última fecha actual = " + ((ultimaFecha||"-").toString() || "-");
    } else {
      $("euRNKm").value = "";
      $("euRNRefKm").textContent = "Referencia: Último km actual = " + ((ultimoKm||"-").toString() || "-");
    }

    $("modalEUReprogNew").style.display = "flex";
  }catch(err){
    console.error(err);
    toast && toast(err.message || String(err));
  }
}

function closeEUReprogNew(){
  const m = $("modalEUReprogNew");
  if (m) m.style.display = "none";
}

function saveEUReprogNew(){
  const interno = ($("euRNInterno")?.value || "").trim();
  const idHP = ($("euRNIdHP")?.value || "").trim();
  const control = ($("euRNControl")?.value || "").trim();
  const motivo = ($("euRNMotivo")?.value || "").trim();

  if (!interno || !idHP){
    toast && toast("Falta Interno o IdHP");
    return;
  }
  if (!motivo){
    $("euRNMsg").textContent = "Motivo obligatorio";
    return;
  }

  const isDias = $("euRNRowDate").style.display !== "none";
  const payload = {
    interno,
    idHP,
    motivo,
    tipo: isDias ? "DIAS" : "KM",
    nuevoUltimo: isDias ? ($("euRNFecha")?.value || "") : ($("euRNKm")?.value || ""),
  };

  if (!payload.nuevoUltimo){
    $("euRNMsg").textContent = isDias ? "Elegí una fecha" : "Ingresá un km";
    return;
  }

  $("euRNMsg").textContent = "";
  setLoading("btnEUReprogNewSave", true);

  google.script.run.withSuccessHandler(res=>{
    setLoading("btnEUReprogNewSave", false);
    if (!res || !res.ok){
      toast && toast(res?.msg || "No se pudo reprogramar");
      return;
    }
    toast && toast("✅ Reprogramado");
    closeEUReprogNew();
    // refrescar EU si existe
    if (EU_LAST?.interno) euBuscar();
  }).withFailureHandler(err=>{
    setLoading("btnEUReprogNewSave", false);
    toast && toast(err.message || String(err));
  }).reprogramarPreventivoUnidadV7(payload);
}

function escapeHtml(s){
    s = (s ?? "").toString();

      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));
  }

  function fmtDate(ms){
    if (!ms) return "";
    const d = new Date(ms);
    const dd = String(d.getDate()).padStart(2,"0");
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const yy = d.getFullYear();
    return `${dd}-${mm}-${yy}`;
  }

function printOT(idOT){
  try{
    // 1) Si viene idOT desde el modal, usamos ese
    let resolved = idOT;

    // 2) Si no vino, intentamos desde el botón del modal (data-idot)
    if(!resolved){
      const btn = document.querySelector('[data-act="printOT"][data-idot]');
      if(btn) resolved = btn.getAttribute('data-idot');
    }

    // 3) Si no, fallback a OT_SELECTED (cuando imprimís desde listado)
    if(!resolved && window.OT_SELECTED && OT_SELECTED.head){
      const h = OT_SELECTED.head;
      resolved = h.IdOT || h.idOT || h["IdOT"];
    }

    if(!resolved) return toast("No se encontró IdOT para imprimir.");

    const url = getScriptUrl()
      + "?view=printOT&idOT=" + encodeURIComponent(resolved)
      + "&token=" + encodeURIComponent(TOKEN)
      + "&v=" + Date.now(); // cache-buster (evita ver versión vieja)

    const w = window.open(url, "_blank");
    if(!w || w.closed || typeof w.closed === "undefined"){
      window.location.href = url; // si el popup está bloqueado
    }
} catch(err){
    console.error(err);
    alert("Error al imprimir: " + (err?.message || err));
  }
}

function hpFreqLabel_(r){
  const km = String(r?.CadaKm || "").trim();
  const di = String(r?.CadaDias || "").trim();
  const parts = [];
  if (km) parts.push(`Cada ${km} km`);
  if (di) parts.push(`Cada ${di} días`);
  return parts.length ? parts.join(" / ") : "-";
}

      fillSelect("hpSector", (res.sectores||[]), "", "Sector: todos");

  }).getHPFiltersOptions(TOKEN);
}

}

        <div class="taskRow">
          <div style="flex:1">
            <div><b>${escapeHtml(t.codigo)}</b> — ${escapeHtml(t.nombre)}</div>
            <div class="muted" style="font-size:12px">${escapeHtml(t.sistema||"")} / ${escapeHtml(t.subsistema||"")} / ${escapeHtml(t.sector||"")}</div>
          </div>
          <button class="mini" onclick="hpAddTask('${escapeHtml(t.codigo)}')">➡️</button>
        </div>
      `).join("") || `<div class="muted">Sin tareas.</div>`)
    : `<div class="muted">⬅️ Primero seleccioná el <b>Sector</b> de la hoja.</div>`;

  $("hpSelected").innerHTML = HP_SELECTED.map(t=>`
    <div class="taskRow">
      <div style="flex:1">
        <div><b>${escapeHtml(t.codigo)}</b> — ${escapeHtml(t.nombre)}</div>
        <div class="muted" style="font-size:12px">${escapeHtml(t.sistema||"")} / ${escapeHtml(t.subsistema||"")} / ${escapeHtml(t.sector||"")}</div>
      </div>
      <button class="mini" onclick="hpRemoveTask('${escapeHtml(t.codigo)}')">⬅️</button>
    </div>
  `).join("") || `<div class="muted">Todavía no seleccionaste tareas.</div>`;
}

function hpAddTask(cod){
  const t = (HP_AVAIL||[]).find(x => x.codigo === cod);
  if (!t) return;
  HP_SELECTED.push({
    codigo: t.codigo,
    nombre: t.nombre,
    sistema: t.sistema,
    subsistema: t.subsistema,
    sector: t.sector
  });
  renderHPLists();
}

function hpRemoveTask(cod){
  HP_SELECTED = HP_SELECTED.filter(x => x.codigo !== cod);
  renderHPLists();
}

function showHPNewErr(msg){
  $("hpNewMsg").textContent = msg;
  $("hpNewMsg").style.display = "block";
}

function saveHPNew(){
  $("hpNewMsg").style.display = "none";

  const NombreHP = $("hpNewNombre").value.trim();
  const Sector = $("hpNewSector").value.trim();
  const Descripcion = $("hpNewDesc").value.trim();
  const Estado = $("hpNewEstado").value.trim() || "activo";

  const CadaKm = ($("hpNewCadaKm") ? $("hpNewCadaKm").value.trim().replace(/[^\d]/g,"") : "");
  const CadaDias = ($("hpNewCadaDias") ? $("hpNewCadaDias").value.trim().replace(/[^\d]/g,"") : "");
  const AlertaDias = ($("hpNewAlertaDias") ? $("hpNewAlertaDias").value.trim().replace(/[^\d]/g,"") : "");
  const AlertaPctKm = ($("hpNewAlertaPctKm") ? $("hpNewAlertaPctKm").value.trim().replace(/[^\d]/g,"") : "");

  if (!NombreHP) return showHPNewErr("Nombre de hoja es obligatorio.");
  if (!Sector) return showHPNewErr("Sector es obligatorio.");
  if (!CadaKm && !CadaDias) return showHPNewErr("Frecuencia obligatoria: completá Cada Km o Cada Días.");
  if (HP_SELECTED.length === 0) return showHPNewErr("Seleccioná al menos 1 tarea.");

  const tareas = HP_SELECTED.map((t, idx) => ({
    CodigoTarea: t.codigo,
    NombreTarea: t.nombre,
    Sistema: t.sistema || "",
    Subsistema: t.subsistema || "",
    Sector: t.sector || Sector,
    Orden: idx + 1
  }));

  setLoading("btnSaveHPNew", true);

  const payload = { NombreHP, Sector, Descripcion, Estado, CadaKm, CadaDias, AlertaDias, AlertaPctKm, tareas };

  google.script.run.withSuccessHandler(res=>{
    setLoading("btnSaveHPNew", false);
    toast("✅ Hoja preventiva creada");
    closeHPNew();

    // refrescar listado
    if (typeof searchHP_UI === "function") {
      $("hpNombre").value = NombreHP;
      searchHP_UI();
    }
  }).withFailureHandler(err=>{
    setLoading("btnSaveHPNew", false);
    showHPNewErr(err.message || String(err));
  }).addHojaPreventiva(TOKEN, payload);
}

// ===== EDITAR HOJA PREVENTIVA (UI) =====
let HP_EDIT_ID = null;
let HP_EDIT_AVAIL = [];     // tareas base (maestro)
let HP_EDIT_SELECTED = [];  // tareas seleccionadas para esa hoja (ordenadas)

function openHPEdit(idHP){
  if (!IS_ADMIN) return alert("Solo administradores pueden editar.");

  if (!$("modalHPEdit")) return alert("No se encontró modalHPEdit. Revisá ui_modals.html.");

  HP_EDIT_ID = String(idHP || "").trim();
  if (!HP_EDIT_ID) return alert("IdHP inválido.");

  $("hpEditMsg").style.display = "none";
  $("modalHPEdit").style.display = "flex";

  // Limpieza
  $("hpEditNombre").value = "";
  $("hpEditDesc").value = "";
  $("hpEditEstado").value = "activo";
  $("hpEditQ").value = "";
  $("hpEditCadaKm").value = "";
  $("hpEditCadaDias").value = "";
  if ($("hpEditAlertaDias")) $("hpEditAlertaDias").value = "";
  if ($("hpEditAlertaPctKm")) $("hpEditAlertaPctKm").value = "";
  HP_EDIT_SELECTED = [];
  HP_EDIT_AVAIL = [];

  // 1) Traer detalles actuales de la hoja (cabecera + tareas)
  google.script.run.withSuccessHandler(res=>{
    const h = res.head || {};
    const tasks = res.tasks || [];

    $("hpEditNombre").value = h.NombreHP || "";
    $("hpEditDesc").value = h.Descripcion || "";
    $("hpEditEstado").value = (h.Estado || "activo").toLowerCase();
    $("hpEditCadaKm").value = String(h.CadaKm || "").replace(/[^\d]/g,"");
    $("hpEditCadaDias").value = String(h.CadaDias || "").replace(/[^\d]/g,"");
    if ($("hpEditAlertaDias")) $("hpEditAlertaDias").value = String(h.AlertaDias || "").replace(/[^\d]/g,"");
    if ($("hpEditAlertaPctKm")) $("hpEditAlertaPctKm").value = String(h.AlertaPctKm || "").replace(/[^\d]/g,"");

    HP_EDIT_SELECTED = tasks.map(t => ({
      codigo: t.CodigoTarea || "",
      nombre: t.NombreTarea || "",
      sistema: t.Sistema || "",
      subsistema: t.Subsistema || "",
      sector: t.Sector || (h.Sector || "")
    })).filter(x => x.codigo && x.nombre);

    // 2) Traer maestro para “disponibles” + sectores
    google.script.run.withSuccessHandler(opt=>{
      if (opt?.ok){
        HP_EDIT_AVAIL = opt.tareas || [];
        fillSelect("hpEditSector", (opt.sectores||[]), (h.Sector||""), "Sector: seleccionar");
      } else {
        fillSelect("hpEditSector", [], (h.Sector||""), "Sector: seleccionar");
      }

      // Si el sector actual no existe en la lista, lo dejamos seleccionado igual
      const sec = (h.Sector || "").toString().trim();
      if (sec && $("hpEditSector") && !Array.from($("hpEditSector").options).some(o => o.value === sec)){
        const o = document.createElement("option");
        o.value = sec; o.textContent = sec; o.selected = true;
        $("hpEditSector").appendChild(o);
      } else {
        $("hpEditSector").value = sec;
      }

      renderHPEditLists();
    }).withFailureHandler(err=>{
      $("hpEditMsg").textContent = err.message || String(err);
      $("hpEditMsg").style.display = "block";
    }).getHPCreateOptions(TOKEN);

  }).withFailureHandler(err=>{
    $("hpEditMsg").textContent = err.message || String(err);
    $("hpEditMsg").style.display = "block";
  }).getHPDetails(TOKEN, HP_EDIT_ID);
}

function closeHPEdit(){
  $("modalHPEdit").style.display = "none";
  HP_EDIT_ID = null;
}

function renderHPEditLists(){
  const sec = ($("hpEditSector").value || "").trim();
  const q = ($("hpEditQ").value || "").toLowerCase().trim();

  const avail = (HP_EDIT_AVAIL||[]).filter(t=>{
    if (!sec) return false;
    const okSec = String(t.sector||"").trim() === sec;
    const blob = `${t.codigo||""} ${t.nombre||""}`.toLowerCase();
    const okQ = !q || blob.includes(q);
    const already = HP_EDIT_SELECTED.some(x => x.codigo === t.codigo);
    return okSec && okQ && !already;
  });

  $("hpEditAvailCount").textContent = sec ? `${avail.length} disponible(s)` : `Elegí un sector…`;
  $("hpEditSelCount").textContent = `${HP_EDIT_SELECTED.length} seleccionada(s)`;

  $("hpEditAvail").innerHTML = sec
    ? (avail.map(t=>`
        <div class="taskRow">
          <div style="flex:1">
            <div><b>${escapeHtml(t.codigo)}</b> — ${escapeHtml(t.nombre)}</div>
            <div class="muted" style="font-size:12px">${escapeHtml(t.sistema||"")} / ${escapeHtml(t.subsistema||"")} / ${escapeHtml(t.sector||"")}</div>
          </div>
          <button class="mini" onclick="hpEditAddTask('${escapeHtml(t.codigo)}')">➡️</button>
        </div>
      `).join("") || `<div class="muted">Sin tareas.</div>`)
    : `<div class="muted">⬅️ Primero seleccioná el <b>Sector</b> de la hoja.</div>`;

  $("hpEditSelected").innerHTML = HP_EDIT_SELECTED.map((t,idx)=>`
    <div class="taskRow">
      <div style="display:flex;gap:6px;align-items:center">
        <button class="mini" onclick="hpEditMove(${idx}, -1)">⬆️</button>
        <button class="mini" onclick="hpEditMove(${idx}, 1)">⬇️</button>
      </div>

      <div style="flex:1">
        <div><b>${escapeHtml(t.codigo)}</b> — ${escapeHtml(t.nombre)}</div>
        <div class="muted" style="font-size:12px">${escapeHtml(t.sistema||"")} / ${escapeHtml(t.subsistema||"")} / ${escapeHtml(t.sector||"")}</div>
      </div>

      <button class="mini" onclick="hpEditRemoveTask('${escapeHtml(t.codigo)}')">⬅️</button>
    </div>
  `).join("") || `<div class="muted">Todavía no seleccionaste tareas.</div>`;
}

function hpEditAddTask(cod){
  const t = (HP_EDIT_AVAIL||[]).find(x => x.codigo === cod);
  if (!t) return;
  HP_EDIT_SELECTED.push({
    codigo: t.codigo,
    nombre: t.nombre,
    sistema: t.sistema,
    subsistema: t.subsistema,
    sector: t.sector
  });
  renderHPEditLists();
}

function hpEditRemoveTask(cod){
  HP_EDIT_SELECTED = HP_EDIT_SELECTED.filter(x => x.codigo !== cod);
  renderHPEditLists();
}

function hpEditMove(idx, dir){
  const j = idx + dir;
  if (idx < 0 || idx >= HP_EDIT_SELECTED.length) return;
  if (j < 0 || j >= HP_EDIT_SELECTED.length) return;
  const tmp = HP_EDIT_SELECTED[idx];
  HP_EDIT_SELECTED[idx] = HP_EDIT_SELECTED[j];
  HP_EDIT_SELECTED[j] = tmp;
  renderHPEditLists();
}

function showHPEditErr(msg){
  $("hpEditMsg").textContent = msg;
  $("hpEditMsg").style.display = "block";
}

function saveHPEdit(){
  $("hpEditMsg").style.display = "none";

  if (!HP_EDIT_ID) return showHPEditErr("IdHP inválido.");

  const NombreHP = $("hpEditNombre").value.trim();
  const Sector = $("hpEditSector").value.trim();
  const Descripcion = $("hpEditDesc").value.trim();
  const Estado = ($("hpEditEstado").value || "activo").trim().toLowerCase();

  const CadaKm = ($("hpEditCadaKm").value || "").toString().replace(/[^\d]/g,"");
  const CadaDias = ($("hpEditCadaDias").value || "").toString().replace(/[^\d]/g,"");
  const AlertaDias = ($("hpEditAlertaDias") ? ($("hpEditAlertaDias").value || "").toString().replace(/[^\d]/g,"") : "");
  const AlertaPctKm = ($("hpEditAlertaPctKm") ? ($("hpEditAlertaPctKm").value || "").toString().replace(/[^\d]/g,"") : "");

  if (!NombreHP) return showHPEditErr("Nombre de hoja es obligatorio.");
  if (!Sector) return showHPEditErr("Sector es obligatorio.");
  if (!CadaKm && !CadaDias) return showHPEditErr("Frecuencia obligatoria: completá Cada Km o Cada Días.");
  if (HP_EDIT_SELECTED.length === 0) return showHPEditErr("Seleccioná al menos 1 tarea.");

  const tareas = HP_EDIT_SELECTED.map((t, idx) => ({
    CodigoTarea: t.codigo,
    NombreTarea: t.nombre,
    Sistema: t.sistema || "",
    Subsistema: t.subsistema || "",
    Sector: t.sector || Sector,
    Orden: idx + 1
  }));

  setLoading("btnSaveHPEdit", true);

  const payload = { IdHP: HP_EDIT_ID, NombreHP, Sector, Descripcion, Estado, CadaKm, CadaDias, AlertaDias, AlertaPctKm, tareas };

  google.script.run.withSuccessHandler(()=>{
    setLoading("btnSaveHPEdit", false);
    toast("✅ Cambios guardados");
    closeHPEdit();
    // refrescar la búsqueda
    if (typeof searchHP_UI === "function") searchHP_UI();
  }).withFailureHandler(err=>{
    setLoading("btnSaveHPEdit", false);
    showHPEditErr(err.message || String(err));
  }).updateHojaPreventiva(TOKEN, payload);
}



  render();
</script>
